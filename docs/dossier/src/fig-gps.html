// Figura: fonti di posizione e scelta della migliore (PH.fixIn, PH.srcPick, PH.applyFix)
const D = new Diagram(1000, 560);

D.box({id:'ap',x:584,y:60,w:400,h:340,k:'web',t:'PH.applyFix(fx)',la:1,s:[
