<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>HorizonAdmin</title>
<!-- HORIZON · strumento di volo · © 2026 Enrico D'Amico · Tutti i diritti riservati.
     HorizonAdmin: console dell'autore, SOLA LETTURA. Non contiene chiavi né indirizzi: l'indirizzo della console di Gmail
     (con la sua chiave) e l'eventuale token GitHub si scrivono nell'app e restano solo su questo telefono. -->
<style>
:root{--bg:#0b0f15;--card:#141a23;--line:#263142;--txt:#e8edf4;--sub:#93a1b5;--ok:#35c066;--warn:#f0b429;--bad:#ff5a5a;--acc:#38d6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:calc(10px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
h1{font-size:19px;margin:0;letter-spacing:.04em;flex:1}
h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);margin:0 0 8px}
button{font:inherit;color:var(--txt);background:#1d2633;border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-height:42px}
button.pri{background:#0f5e78;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:#0f141c;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-size:26px;line-height:1.1}
.tile span{color:var(--sub);font-size:13px}
.tile.warn b{color:var(--warn)} .tile.bad b{color:var(--bad)} .tile.ok b{color:var(--ok)}
.row{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row small{color:var(--sub);white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:var(--sub);flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
a{color:var(--acc);text-decoration:none}
.sub{color:var(--sub);font-size:13px}
.msg{border-radius:10px;padding:9px 12px;margin:0 0 12px;background:#2a1f0a;border:1px solid var(--warn);color:#ffdf9a}
.msg.bad{background:#2a0f0f;border-color:var(--bad);color:#ffb9b9}
label{display:block;color:var(--sub);font-size:13px;margin:10px 0 4px}
input{width:100%;font:inherit;color:var(--txt);background:#0f141c;border:1px solid var(--line);border-radius:10px;padding:10px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--sub);margin:2px 4px 2px 0}
.scroll{overflow-x:auto}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>HorizonAdmin</h1><button id="bAgg" class="pri">Aggiorna</button><button id="bImp" aria-label="Impostazioni">⚙</button></header>
<p class="sub" id="quando">Sola lettura · mai aggiornato</p>
<div id="avvisi"></div>

<section class="card" id="cImp" hidden>
  <h2>Impostazioni</h2>
  <p class="sub">Restano solo su questo telefono. La console è in sola lettura: non può cambiare niente.</p>
  <label for="iCons">Indirizzo della console di Gmail (lo dà lo script, funzione «console»)</label>
  <input id="iCons" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec?k=…">
  <label for="iTok">Token GitHub (facoltativo: senza, GitHub risponde a 60 domande l'ora)</label>
  <input id="iTok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <p style="margin:12px 0 0"><button id="bSalva" class="pri">Salva e aggiorna</button> <button id="bCanc">Cancella tutto</button></p>
</section>

<section class="card"><h2>Da fare</h2><div class="tiles" id="code"></div><div id="codeL"></div></section>
<section class="card"><h2>Salute del sistema</h2><div id="salute"></div></section>
<section class="card"><h2>Segnalazioni · cosa ha fatto l'agente</h2><div id="seg"></div></section>
<section class="card"><h2>Versioni pubblicate</h2><div id="ver"></div></section>
<p class="sub" id="piede"></p>

<script>
'use strict';
const REPO='amicoen-ops/HORIZON', API='https://api.github.com/repos/'+REPO, RAW='https://raw.githubusercontent.com/'+REPO+'/licenze/';
const LAVORI=[['licenze-posta.yml','Posta: licenze e segnalazioni',90],['build-apk.yml','App HORIZON',0],['horizon2.yml','HORIZON 2 e orologio',0],
  ['pubblica-web.yml','Versione web',0],['test-assetto.yml','Prove automatiche',0]];
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[<&>"']/g,c=>({'<':'&lt;','&':'&amp;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k);}catch(e){}}};
const fa=t=>{ if(!t) return '—'; const m=Math.round((Date.now()-new Date(t).getTime())/60000);
  return m<1?'adesso':m<60?m+' min fa':m<1440?Math.round(m/60)+' h fa':Math.round(m/1440)+' g fa'; };
const giorno=t=>new Date(t).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const solohttps=u=>/^https:\/\//i.test(u)?u:'#';
let avvisi=[];
const avvisa=(testo,grave)=>avvisi.push(`<div class="msg${grave?' bad':''}">${esc(testo)}</div>`);

async function gh(percorso){
  const h={Accept:'application/vnd.github+json'}, t=ls.get('adm_tok'); if(t) h.Authorization='Bearer '+t;
  const r=await fetch(API+percorso,{headers:h,cache:'no-store'});
  if(r.status===403||r.status===429) throw new Error('GitHub: troppe domande, riprova tra un po\' (o metti il token nelle impostazioni)');
  if(r.status===401) throw new Error('GitHub: token non valido o scaduto');
  if(!r.ok) throw new Error('GitHub ha risposto '+r.status);
  return r.json();
}

async function salute(){
  const el=$('salute'); el.innerHTML='<p class="sub">Carico…</p>';
  const righe=await Promise.all(LAVORI.map(async([f,nome,maxMin])=>{
    try{ const d=await gh('/actions/workflows/'+f+'/runs?per_page=1&branch=main'), r=d.workflow_runs&&d.workflow_runs[0];
      if(!r) return `<div class="row"><span class="dot"></span><span class="t">${esc(nome)}</span><small>mai partito</small></div>`;
      const corso=r.status!=='completed', ok=r.conclusion==='success', min=(Date.now()-new Date(r.run_started_at||r.created_at))/60000;
      const vecchio=maxMin&&min>maxMin;
      if(!corso&&!ok) avvisa(nome+': ultima corsa non riuscita.',true);
      if(vecchio) avvisa(nome+': non parte da '+fa(r.run_started_at||r.created_at)+' (dovrebbe girare almeno ogni ora).',false);
      return `<div class="row"><span class="dot ${corso?'warn':ok&&!vecchio?'ok':ok?'warn':'bad'}"></span><a class="t" href="${esc(solohttps(r.html_url))}" target="_blank" rel="noopener">${esc(nome)}</a>
        <small>${corso?'in corso':ok?'riuscito':r.conclusion==='failure'?'non riuscito':r.conclusion==='cancelled'?'annullato':esc(r.conclusion||'?')} · ${fa(r.run_started_at||r.created_at)}</small></div>`;
    }catch(e){ return `<div class="row"><span class="dot bad"></span><span class="t">${esc(nome)}</span><small>${esc(e.message)}</small></div>`; } }));
  el.innerHTML=righe.join('');
}

async function versioni(){
  const el=$('ver'); el.innerHTML='<p class="sub">Carico…</p>';
  try{ const d=await gh('/releases?per_page=12');
    const prima=p=>d.find(x=>x.tag_name.startsWith(p));
    el.innerHTML=[['build-','HORIZON'],['horizon2-','HORIZON 2'],['admin-','HorizonAdmin']].map(([p,n])=>{ const r=prima(p);
      return r?`<div class="row"><a class="t" href="${esc(solohttps(r.html_url))}" target="_blank" rel="noopener">${esc(n)} · ${esc(r.tag_name)}</a><small>${fa(r.published_at)}</small></div>`
              :`<div class="row"><span class="t">${esc(n)}</span><small>nessuna</small></div>`; }).join('');
  }catch(e){ el.innerHTML=`<p class="sub">${esc(e.message)}</p>`; }
}

// registro anonimo dei casi (ramo «licenze», pubblico): data | tipo | versione | canale | modello | esito | regole
async function segnalazioni(){
  const el=$('seg'); el.innerHTML='<p class="sub">Carico…</p>';
  const mesi=[0,1].map(i=>{ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); return d.toISOString().slice(0,7); });
  let righe=[];
  for(const m of mesi){ try{ const r=await fetch(RAW+'segnalazioni/'+m+'.txt',{cache:'no-store'}); if(r.ok) righe=righe.concat((await r.text()).split('\n').filter(x=>x.trim())); }catch(e){} }
  const casi=righe.map(x=>x.split('|').map(y=>y.trim())).filter(c=>c.length>=7).map(c=>({d:c[0],tipo:c[1],ver:c[2],canale:c[3],tel:c[4],esito:c[5],regole:c[6]}));
  const da=new Date(Date.now()-14*864e5).toISOString().slice(0,10), rec=casi.filter(c=>c.d>=da).sort((a,b)=>a.d<b.d?1:-1);
  if(!rec.length){ el.innerHTML='<p class="sub">Nessuna segnalazione negli ultimi 14 giorni.</p>'; return; }
  const ric=rec.filter(c=>c.esito==='riconosciuto').length, sb=rec.filter(c=>/SBAGLIATA/.test(c.esito)).length;
  const conta={}; rec.forEach(c=>(c.esito==='riconosciuto'?c.regole.split(','):['a te: '+c.esito.replace(/^autore:\s*/,'')]).forEach(k=>{ k=k.trim(); if(k&&k!=='-') conta[k]=(conta[k]||0)+1; }));
  if(sb) avvisa((sb===1?'Una risposta automatica segnata come sbagliata':sb+' risposte automatiche segnate come sbagliate')+' negli ultimi 14 giorni: c\'è una regola da correggere.',false);
  el.innerHTML=`<div class="tiles"><div class="tile ok"><b>${ric}</b><span>risposte automatiche</span></div><div class="tile ${rec.length-ric?'warn':''}"><b>${rec.length-ric}</b><span>rimaste a te</span></div></div>
    <p class="sub" style="margin:10px 0 4px">Ultimi 14 giorni, per regola:</p><p style="margin:0 0 6px">${Object.entries(conta).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<span class="tag">${esc(k)} · ${n}</span>`).join('')}</p>
    ${rec.slice(0,25).map(c=>`<div class="row"><span class="dot ${c.esito==='riconosciuto'?'ok':/SBAGLIATA/.test(c.esito)?'bad':'warn'}"></span><span class="t">${esc(c.tipo)} · ${esc(c.ver)} · ${esc(c.tel)}<br><span class="sub">${esc(c.esito==='riconosciuto'?c.regole:c.esito)}</span></span><small>${esc(c.d.slice(8,10)+'/'+c.d.slice(5,7))}</small></div>`).join('')}`;
}

// code di lavoro: le dà lo script in Gmail (funzione doGet), con la chiave nell'indirizzo
async function code(){
  const t=$('code'), l=$('codeL'), u=ls.get('adm_cons'); l.innerHTML='';
  if(!u){ t.innerHTML=''; l.innerHTML='<p class="sub">Per vedere le code della posta scrivi nelle impostazioni (⚙) l\'indirizzo della console di Gmail.</p>'; return; }
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec\?k=[\w-]{16,}$/.test(u)){ t.innerHTML=''; l.innerHTML='<p class="sub">L\'indirizzo della console non ha la forma giusta: ricopialo dallo script.</p>'; return; }
  t.innerHTML='<p class="sub">Carico…</p>';
  try{ const r=await fetch(u,{cache:'no-store',redirect:'follow'}); if(!r.ok) throw new Error('la console ha risposto '+r.status);
    const d=await r.json(); if(d.errore) throw new Error(d.errore);
    const c=d.code||[];
    t.innerHTML=c.map(q=>`<div class="tile ${q.info?'':q.n?(q.urgente?'bad':'warn'):'ok'}"><b>${+q.n||0}</b><span>${esc(q.nome)}</span></div>`).join('');
    l.innerHTML=c.filter(q=>q.voci&&q.voci.length).map(q=>`<p class="sub" style="margin:12px 0 2px">${esc(q.nome)}</p>`+q.voci.map(v=>
      `<div class="row"><a class="t" href="${esc(solohttps(v.link))}" target="_blank" rel="noopener">${esc(v.oggetto)}</a><small>${esc(v.quando?giorno(v.quando):'')}</small></div>`).join('')).join('');
    const s=d.stato||{};
    if(s.token===false) avvisa('Nello script di Gmail manca il token GitHub: la sveglia non può far partire i lavori.',true);
    if(s.sveglie===0) avvisa('Nello script di Gmail non c\'è nessuna sveglia attiva: lancia «installa».',true);
    if(s.scadenzaToken){ const g=Math.round((new Date(s.scadenzaToken)-Date.now())/864e5); if(g<=14) avvisa('Il token GitHub delle licenze scade tra '+g+' giorni.',g<=3); }
    $('piede').textContent='Console di Gmail: ultimo avvio del giro '+fa(s.ultimoAvvio)+(s.scadenzaToken?' · token valido fino al '+new Date(s.scadenzaToken).toLocaleDateString('it-IT'):'');
  }catch(e){ t.innerHTML=''; l.innerHTML=`<p class="sub">Code non lette: ${esc(e.message)}.</p>`; }
}

let inCorso=false;
async function aggiorna(){
  if(inCorso) return; inCorso=true; $('bAgg').disabled=true; avvisi=[]; $('avvisi').innerHTML='';
  await Promise.all([code(),salute(),segnalazioni(),versioni()].map(p=>p.catch(()=>{})));
  $('avvisi').innerHTML=avvisi.join(''); $('quando').textContent='Sola lettura · aggiornato alle '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  inCorso=false; $('bAgg').disabled=false;
}
$('bAgg').onclick=aggiorna;
$('bImp').onclick=()=>{ const c=$('cImp'); c.hidden=!c.hidden; if(!c.hidden){ $('iCons').value=ls.get('adm_cons'); $('iTok').value=ls.get('adm_tok'); } };
$('bSalva').onclick=()=>{ ls.set('adm_cons',$('iCons').value.trim()); ls.set('adm_tok',$('iTok').value.trim()); $('cImp').hidden=true; aggiorna(); };
$('bCanc').onclick=()=>{ ls.set('adm_cons',''); ls.set('adm_tok',''); $('iCons').value=$('iTok').value=''; aggiorna(); };
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) aggiorna(); });
aggiorna();
</script>
</body>
</html>
