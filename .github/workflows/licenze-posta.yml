name: Licenze per posta

# Legge la casella horizonlicenses quando lo fa partire lo script in Gmail (tools/gmail-licenze, ogni 10 minuti e dai tasti
# Mensile/Annuale/Perenne) o ogni ora come riserva (vedi tools/posta_licenze.py):
#  · richieste nuove di licenza → risponde con prezzi e link PayPal (fuori dall'app);
#  · mail con l'etichetta M, A o P (messa a mano dall'autore dopo il pagamento) → crea il codice, lo manda al pilota,
#    lo annota nel registro cifrato sul ramo «licenze» (anche nome e mail del pilota), sposta la mail in «Gestite»
#    una volta al giorno (e a richiesta: input «riepilogo») manda all'autore la mail «Riepilogo licenze» con la tabella
#    di tutte, che finisce nell'etichetta «Archivio generale licenze»;
#  · segnalazioni «Pista rilevata» e «Campi usati» dall'app: le righe anonime HORIZON-PISTA/HORIZON-CAMPI vanno nella
#    cartella piste/ del ramo «licenze» (le legge il lavoro settimanale con tools/piste_piloti.py), la mail in «Piste lette»;
#  · segnalazioni dei piloti («Problema», «Registrazione sensori»…): tools/segnalazioni.py le analizza dai dati tecnici;
#    i casi riconosciuti hanno risposta automatica e vanno in «Segnalazioni analizzate», gli altri restano in arrivo con
#    «Segnalazioni da vedere». Una riga anonima per caso va in segnalazioni/ del ramo «licenze».
# Serve il segreto GMAIL_LICENZE (password per le app di horizonlicenses); senza, la corsa non fa niente.
# Progetto pubblico: nei log solo conteggi.
on:
  schedule:
    - cron: '23 * * * *'          # riserva ogni ora: la sveglia vera è lo script in Gmail (tools/gmail-licenze)
  workflow_dispatch:
    inputs:
      riepilogo:
        description: 'Manda alla casella di HORIZON la mail con la tabella di tutte le licenze'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: licenze-posta         # gruppo suo: non annulla mai un giro manuale di «Licenze» in attesa

jobs:
  posta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Segreto presente?
        id: ok
        env:
          G: ${{ secrets.GMAIL_LICENZE }}
        run: |
          if [ -n "$G" ]; then echo "si=1" >> "$GITHUB_OUTPUT"; else echo "Segreto GMAIL_LICENZE non ancora impostato, niente da fare."; fi
      - uses: actions/checkout@v5
        if: steps.ok.outputs.si == '1'
      - name: Ramo «licenze»
        if: steps.ok.outputs.si == '1'
        run: |
          git config --global user.name "github-actions[bot]"; git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin licenze && git worktree add -q reg origin/licenze -b licenze-loc
      - run: pip install --quiet cryptography
        if: steps.ok.outputs.si == '1'
      - name: Posta
        if: steps.ok.outputs.si == '1'
        id: posta
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LICENZE_PASSWORD: ${{ secrets.LICENZE_PASSWORD }}
          GMAIL_LICENZE: ${{ secrets.GMAIL_LICENZE }}
          GMAIL_UTENTE: horizonlicenses@gmail.com
          PAYPAL: https://www.paypal.me/amicoen
          MANDA_RIEPILOGO: ${{ inputs.riepilogo }}
        run: |
          set -e
          umask 077; T="$RUNNER_TEMP/lic"; mkdir -p "$T"
          scegli(){ if [ -f "$1/cifratura-v2.txt" ]; then export LP="$LICENZE_PASSWORD"; else export LP="$KEYSTORE_PASSWORD"; fi; }   # password delle licenze: la nuova dopo «cambia-password»
          scegli reg/licenze
          dec(){ openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$1" -out "$2" -pass env:LP; }
          dec reg/licenze/chiave_privata.pem.enc "$T/priv.pem"; dec reg/licenze/registro.json.enc "$T/reg.json"
          if [ -f reg/licenze/prezzi.json.enc ]; then dec reg/licenze/prezzi.json.enc "$T/prezzi.json"; fi
          cp reg/licenze/ultimo_riepilogo.txt "$T/ultimo.txt" 2>/dev/null || true
          PRIVATA="$T/priv.pem" PUBBLICA=reg/licenze/chiave_pubblica.txt REGISTRO="$T/reg.json" PREZZI="$T/prezzi.json" \
          REVOCATE=reg/licenze/revocate.json ULTIMO_RIEPILOGO="$T/ultimo.txt" PISTE="$T/piste" SEGNALAZIONI="$T/segnalazioni" RIEPILOGO="$GITHUB_STEP_SUMMARY" \
            python3 tools/posta_licenze.py
      # sempre, anche se il passo prima si è fermato a metà o è scaduto il tempo: i codici già mandati restano annotati.
      # Se nel frattempo un altro giro ha scritto sul ramo, i due registri si uniscono (tools/registro_unisci.py).
      - name: Salva il registro
        if: always() && steps.ok.outputs.si == '1'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LICENZE_PASSWORD: ${{ secrets.LICENZE_PASSWORD }}
        run: |
          set -e
          T="$RUNNER_TEMP/lic"; [ -d "$T" ] || exit 0
          dec(){ openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$1" -out "$2" -pass env:LP; }
          enc(){ openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -in "$1" -out "$2" -pass env:LP; }
          diverso(){ [ ! -f "$1" ] || ! cmp -s <(dec "$1" /dev/stdout) "$2"; }   # confronto in chiaro: il cifrato cambia sempre
          scegli(){ if [ -f "$1/cifratura-v2.txt" ]; then export LP="$LICENZE_PASSWORD"; else export LP="$KEYSTORE_PASSWORD"; fi; }   # password delle licenze: la nuova dopo «cambia-password»
          cd reg; salvato=0; scegli licenze
          for prova in 1 2 3 4; do
            if [ "$prova" -gt 1 ]; then
              sleep $((prova * 3)); git fetch -q origin licenze; git reset -q --hard origin/licenze
              cp "$T/reg.json" "$T/nostro.json"; scegli licenze     # il ramo può essere appena passato alla password nuova
              dec licenze/registro.json.enc "$T/remoto.json"; python3 ../tools/registro_unisci.py "$T/remoto.json" "$T/nostro.json" "$T/reg.json"
            fi
            if [ -f "$T/reg.json" ] && diverso licenze/registro.json.enc "$T/reg.json"; then enc "$T/reg.json" licenze/registro.json.enc; fi
            if [ -f "$T/prezzi.json" ] && diverso licenze/prezzi.json.enc "$T/prezzi.json"; then enc "$T/prezzi.json" licenze/prezzi.json.enc; fi
            if [ -f "$T/ultimo.txt" ]; then cp "$T/ultimo.txt" licenze/ultimo_riepilogo.txt; fi
            if ls "$T"/piste/*.txt >/dev/null 2>&1; then mkdir -p piste; cp "$T"/piste/*.txt piste/; fi   # righe anonime per piste_piloti.py
            if [ -f "$T/segnalazioni/nuove.txt" ]; then mkdir -p segnalazioni; cat "$T/segnalazioni/nuove.txt" >> "segnalazioni/$(date +%Y-%m).txt"; fi   # registro anonimo dei casi (tools/segnalazioni.py)
            if [ -z "$(git status --porcelain)" ]; then salvato=1; break; fi
            git add -A; git commit -qm "Licenze: registro e riepilogo [skip ci]"
            if git push -q origin HEAD:licenze; then salvato=1; break; fi
          done
          cd ..; rm -rf "$T"
          [ "$salvato" = 1 ] || { echo "::error::Registro non salvato dopo 4 tentativi"; exit 1; }
