name: Licenze

# Codici di licenza di HORIZON (vedi tools/licenze.py). Si lancia a mano da GitHub › Actions › Licenze › Run workflow.
#  · crea-chiave: una volta sola. Crea la chiave privata (cifrata con KEYSTORE_PASSWORD) e la pubblica, sul ramo «licenze».
#  · genera: crea il codice per un telefono (tipo M/A/P), lo annota nel registro cifrato e lo scrive nel riepilogo della corsa.
#  · revoca: aggiunge il numero di una licenza alla lista pubblica delle revocate (l'app la legge quando ha internet),
#    con la data nello storico (solo numeri e date: la lista è pubblica); il riepilogo giornaliero lo mostra.
#  · ripristina: toglie il numero dalla lista (revoca fatta per errore o per prova).
# Il progetto è pubblico: nei campi qui sotto niente dati personali (nomi, mail). Il codice di licenza invece si può
# mostrare: funziona solo sul telefono per cui è fatto.
on:
  workflow_dispatch:
    inputs:
      azione:
        description: 'Cosa fare'
        type: choice
        options: [genera, revoca, ripristina, crea-chiave]
        default: genera
      tipo:
        description: 'Tipo: M mensile, A annuale, P perenne'
        type: choice
        options: [A, M, P]
        default: A
      telefono:
        description: 'Codice del telefono (XXXX-XXXX-XXXX, dal menu riservato dell''app)'
        required: false
      numero:
        description: 'Solo per «revoca» e «ripristina»: numero della licenza'
        required: false

permissions:
  contents: write

concurrency: licenze-manuale      # gruppo suo: la sveglia della posta non lo annulla mai

jobs:
  licenze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ramo «licenze» (registro cifrato, chiavi, revocate)
        run: |
          git config --global user.name "github-actions[bot]"; git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin licenze 2>/dev/null; then git worktree add reg origin/licenze -b licenze-loc; else
            git worktree add --orphan -b licenze-loc reg; mkdir -p reg/licenze; echo '{"revocate": []}' > reg/licenze/revocate.json
            printf '%s\n' "Ramo delle licenze di HORIZON: chiave pubblica, chiave privata e registro cifrati, licenze revocate." > reg/LEGGIMI.txt; fi
      - run: pip install --quiet cryptography
      - name: Azione
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GMAIL_LICENZE: ${{ secrets.GMAIL_LICENZE }}
          GMAIL_UTENTE: horizonlicenses@gmail.com
          AZIONE: ${{ inputs.azione }}
          TIPO: ${{ inputs.tipo }}
          TELEFONO: ${{ inputs.telefono }}
          NUMERO: ${{ inputs.numero }}
        run: |
          set -e
          cd reg; mkdir -p licenze; L=licenze; umask 077; T="$RUNNER_TEMP/lic"; mkdir -p "$T"
          dec(){ openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$1" -out "$2" -pass env:KEYSTORE_PASSWORD; }
          enc(){ openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -in "$1" -out "$2" -pass env:KEYSTORE_PASSWORD; }
          A=../tools/licenze_azione.py
          if [ "$AZIONE" = crea-chiave ]; then
            if [ -f $L/chiave_privata.pem.enc ]; then echo "::error::La chiave esiste già: non si ricrea (i codici già dati smetterebbero di valere)"; exit 1; fi
            python3 ../tools/licenze.py chiave "$T/priv.pem" $L/chiave_pubblica.txt
            enc "$T/priv.pem" $L/chiave_privata.pem.enc; echo '[]' > "$T/reg.json"; enc "$T/reg.json" $L/registro.json.enc
            git add -A; git commit -qm "Licenze: chiave creata [skip ci]"; git push -q origin HEAD:licenze
            { echo "## Chiave creata"; echo; echo "Chiave pubblica (va nell'app, www/riservato.js):"; echo; echo '```'; cat $L/chiave_pubblica.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            rm -rf "$T"; exit 0
          fi
          [ -f $L/chiave_privata.pem.enc ] || { echo "::error::Prima lancia «crea-chiave»"; exit 1; }
          # l'azione si applica alla copia più recente del ramo; se il push trova il ramo cambiato (un altro giro ha
          # scritto), si riprende la copia nuova e si riapplica: niente si perde e niente si annulla in silenzio
          salvato=0; nulla=
          for prova in 1 2 3 4; do
            if [ "$prova" -gt 1 ]; then sleep $((prova * 3)); git fetch -q origin licenze; git reset -q --hard origin/licenze; fi
            dec $L/registro.json.enc "$T/reg.json"
            case "$AZIONE" in
              genera) dec $L/chiave_privata.pem.enc "$T/priv.pem"; python3 $A genera "$T/reg.json" "$T/priv.pem" "$T/stato.json"
                      enc "$T/reg.json" $L/registro.json.enc ;;
              revoca|ripristina) python3 $A "$AZIONE" "$T/reg.json" ;;
            esac
            if [ -z "$(git status --porcelain)" ]; then salvato=1; nulla=1; break; fi
            git add -A; git commit -qm "Licenze: $AZIONE [skip ci]"
            if git push -q origin HEAD:licenze; then salvato=1; break; fi
          done
          [ "$salvato" = 1 ] || { echo "::error::Ramo «licenze» non aggiornato dopo 4 tentativi"; rm -rf "$T"; exit 1; }
          [ -n "$nulla" ] && { rm -rf "$T"; exit 0; }       # niente da cambiare (es. già revocata): lo ha scritto l'azione
          case "$AZIONE" in
            genera) python3 $A manda "$T/stato.json" ;;     # il codice parte solo dopo che il registro è salvato
            revoca) echo "## Licenza n. $NUMERO revocata" >> "$GITHUB_STEP_SUMMARY"; echo "I telefoni la vedono revocata appena hanno internet (ogni giorno e quando si apre il menu riservato)." >> "$GITHUB_STEP_SUMMARY" ;;
            ripristina) echo "## Licenza n. $NUMERO ripristinata" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          rm -rf "$T"
