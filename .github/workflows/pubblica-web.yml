name: Pubblica la versione web (iPhone, Chrome)

# Sito: https://amicoen-ops.github.io/HORIZON/
# Una volta sola: Settings › Pages › Source: «GitHub Actions».
on:
  push:
    branches: [main]
  schedule:
    - cron: "40 3 * * *"          # ogni notte: copia aggiornata degli spazi aerei d'Italia (openAIP, e open flightmaps di riserva)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sito:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Pagine
        run: |
          mkdir -p sito/dati
          cp -r www/. sito/
          rm -f sito/capacitor.js
          sed -i 's#<script src="capacitor.js"></script>##' sito/index.html
          # impronta delle pagine: cambia solo quando cambia l'app, così il controllo all'avvio propone di ricaricare solo se serve
          h=$(cat www/index.html www/app.html www/regole.js www/carburante.js www/prestazioni.js www/licenza.js www/guida.js www/squadriglia.js www/frequenze.js www/radio.js www/stimati.js www/impostazioni.js www/emergenza.js www/livelli.js www/note.js www/schermo.js www/carta.js www/carta-web.js www/vento.js www/schede.js www/voce.js www/orologio.js www/riservato.js www/spazi3d.js | sha1sum | cut -c1-8)
          d=$(git log -1 --format=%cd --date=format:%d.%m.%Y)
          echo "window.IA517_BUILD={version:'web ${d}',build:'${h}',channel:'web'};" > sito/version.js
          # spazi aerei d'Italia da openAIP (CC BY-NC 4.0): copia sullo stesso sito, leggibile anche dal browser
          # si scarica in un file a parte e si sposta solo se lo scarico è finito: un file a metà (tempo scaduto) non va sul sito
          for cc in it fr ch at si; do
            if curl -sSfL --max-time 120 -o scarico.tmp https://storage.openaip.net/openaip-system-exports/${cc}_asp_v2.txt; then mv scarico.tmp sito/dati/${cc}_asp_v2.txt; else rm -f scarico.tmp; echo "openAIP $cc non raggiungibile"; fi
          done
          # spazi aerei di riserva da open flightmaps (OFMA General Users' License): Italia e fascia alpina, per quando openAIP non risponde
          python3 tools/ofm_openair.py sito/dati/ofm_it.txt --solo-italia ofm_li.txt || echo "open flightmaps non raggiungibile"
          # confronto dettagliato openAIP / open flightmaps (solo Italia): sul sito e nel riepilogo di questa corsa
          if [ -s sito/dati/it_asp_v2.txt ] && [ -s ofm_li.txt ]; then
            python3 tools/confronta_spazi.py sito/dati/it_asp_v2.txt ofm_li.txt --nomi openAIP "open flightmaps" --md sito/dati/confronto_spazi.md && cat sito/dati/confronto_spazi.md >> "$GITHUB_STEP_SUMMARY" || echo "confronto non riuscito"
          fi
          # campi con carburante (openAIP): letti dall'app una volta al giorno per gli alternati con rifornimento
          mkdir -p oa
          for cc in it fr ch at si; do
            if curl -sSfL --max-time 120 -o scarico.tmp https://storage.openaip.net/openaip-system-exports/${cc}_apt.json; then mv scarico.tmp oa/${cc}_apt.json; else rm -f scarico.tmp; echo "openAIP campi $cc non raggiungibili"; fi
          done
          python3 tools/carburante_openaip.py oa sito/dati/carburante.json || echo "carburante non aggiornato"
          ls -la sito sito/dati
      # La vecchia «v2» del ramo v2 era rimasta indietro: ora /v2/ porta alla versione attuale (HORIZON 2 è l'app
      # Android di prova con l'orologio Garmin, compilata dagli stessi file della versione 1 più il collegamento).
      - name: /v2/ porta alla versione attuale
        run: |
          mkdir -p sito/v2
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../"><title>HORIZON</title><a href="../">HORIZON</a>' > sito/v2/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito
      - id: deploy
        uses: actions/deploy-pages@v4
