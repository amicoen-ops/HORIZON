name: Pubblica la versione web (iPhone, Chrome)

# Sito: https://amicoen-ops.github.io/HORIZON/
# Una volta sola: Settings › Pages › Source: «GitHub Actions».
on:
  push:
    branches: [main]
  schedule:
    - cron: "40 3 * * *"          # ogni notte: copia aggiornata degli spazi aerei d'Italia (openAIP, e open flightmaps di riserva)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sito:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Pagine
        run: |
          mkdir -p sito/dati
          cp -r www/. sito/
          rm -f sito/capacitor.js
          sed -i 's#<script src="capacitor.js"></script>##' sito/index.html
          # impronta delle pagine: cambia solo quando cambia l'app, così il controllo all'avvio propone di ricaricare solo se serve
          h=$(cat www/index.html www/app.html www/regole.js www/carburante.js www/licenza.js www/guida.js www/squadriglia.js www/frequenze.js www/radio.js www/stimati.js www/impostazioni.js www/emergenza.js www/spazi3d.js | sha1sum | cut -c1-8)
          d=$(git log -1 --format=%cd --date=format:%d.%m.%Y)
          echo "window.IA517_BUILD={version:'web ${d}',build:'${h}',channel:'web'};" > sito/version.js
          # spazi aerei d'Italia da openAIP (CC BY-NC 4.0): copia sullo stesso sito, leggibile anche dal browser
          for cc in it fr ch at si; do
            curl -sSfL --max-time 120 -o sito/dati/${cc}_asp_v2.txt https://storage.openaip.net/openaip-system-exports/${cc}_asp_v2.txt || echo "openAIP $cc non raggiungibile"
          done
          # spazi aerei di riserva da open flightmaps (OFMA General Users' License): Italia e fascia alpina, per quando openAIP non risponde
          python3 tools/ofm_openair.py sito/dati/ofm_it.txt --solo-italia ofm_li.txt || echo "open flightmaps non raggiungibile"
          # confronto dettagliato openAIP / open flightmaps (solo Italia): sul sito e nel riepilogo di questa corsa
          if [ -s sito/dati/it_asp_v2.txt ] && [ -s ofm_li.txt ]; then
            python3 tools/confronta_spazi.py sito/dati/it_asp_v2.txt ofm_li.txt --nomi openAIP "open flightmaps" --md sito/dati/confronto_spazi.md && cat sito/dati/confronto_spazi.md >> "$GITHUB_STEP_SUMMARY" || echo "confronto non riuscito"
          fi
          # campi con carburante (openAIP): letti dall'app una volta al giorno per gli alternati con rifornimento
          mkdir -p oa
          for cc in it fr ch at si; do curl -sSfL --max-time 120 -o oa/${cc}_apt.json https://storage.openaip.net/openaip-system-exports/${cc}_apt.json || echo "openAIP campi $cc non raggiungibili"; done
          python3 tools/carburante_openaip.py oa sito/dati/carburante.json || echo "carburante non aggiornato"
          ls -la sito sito/dati
      - name: Versione 2 di prova in /v2/ (dai sorgenti del ramo v2)
        run: |
          git fetch --depth 1 origin v2 && mkdir -p v2src && git --work-tree=v2src checkout origin/v2 -- sorgenti LICENSE NOTE-TERZE-PARTI || { echo "ramo v2 non disponibile"; exit 0; }
          pip install --quiet pillow
          python3 v2src/sorgenti/build_android.py
          mkdir -p sito/v2 && cp -r v2src/sorgenti/www_build/. sito/v2/
          rm -f sito/v2/capacitor.js sito/v2/LEGGIMI.md
          h=$(cat sito/v2/index.html sito/v2/app.html sito/v2/carburante.js | sha1sum | cut -c1-8)
          echo "window.IA517_BUILD={version:'v2 web',build:'${h}',channel:'web',line:'v2'};" > sito/v2/version.js
          sed -i -E "s/\"(short_)?name\": *\"[^\"]*\"/\"\1name\": \"HORIZON v2\"/g" sito/v2/manifest.webmanifest
          cp -r sito/dati sito/v2/dati
          git checkout HEAD -- . 2>/dev/null || true
          ls -la sito/v2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito
      - id: deploy
        uses: actions/deploy-pages@v4
