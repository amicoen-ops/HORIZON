name: Collaudo su emulatore

on:
  workflow_run:
    workflows: ["Compila APK"]
    types: [completed]
  push:
    branches: [prova]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  emulatore:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: KVM per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: APK di collaudo dell'ultima compilazione (l'APK pubblico non permette il debug della WebView)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)
          echo "TAG=$TAG" >> $GITHUB_ENV
          RUN="${{ github.event.workflow_run.id }}"
          [ -n "$RUN" ] || RUN=$(gh run list -R ${{ github.repository }} -w "Compila APK" -s success -L 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$RUN" -R ${{ github.repository }} -n apk-collaudo -D apk
          mv apk/HORIZON-collaudo.apk app.apk
          pip install websocket-client

      - name: Prova sull'emulatore (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/emu_test.sh app.apk out

      - name: Schermate e registro come artifact del workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collaudo-${{ env.TAG || github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

      - name: Risultati in una issue (schermate nella pre-release «diagnostica»)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          gh release view diagnostica -R $R >/dev/null 2>&1 || gh release create diagnostica -R $R --prerelease --title "Diagnostica (schermate del collaudo)" --notes "Non è una versione da installare."
          # Pulizia: GitHub ammette al massimo 1000 asset per release. Si tengono solo gli
          # asset delle 10 build caricate più di recente (prefisso build-N_ o v2-build-N_),
          # più quelli della build corrente; gli altri asset (es. it_*) non si toccano.
          RID=$(gh api repos/$R/releases/tags/diagnostica --jq .id)
          gh api --paginate "repos/$R/releases/$RID/assets?per_page=100" \
            --jq '.[] | select(.name|test("^(v2-)?build-[0-9]+_")) | "\(.id) \(.created_at) \(.name|capture("^(?<p>(v2-)?build-[0-9]+)_").p)"' > ../asset.txt
          sort -k2,2r ../asset.txt | awk '!s[$3]++ && n++ < 10 {print $3}' > ../tieni.txt
          [ -n "$TAG" ] && echo "$TAG" >> ../tieni.txt
          awk 'NR==FNR {k[$1]=1; next} !($3 in k) {print $1, $3}' ../tieni.txt ../asset.txt > ../da_cancellare.txt
          echo "Asset build in release: $(wc -l < ../asset.txt); da cancellare: $(wc -l < ../da_cancellare.txt); build tenute: $(sort -u ../tieni.txt | tr '\n' ' ')"
          while read -r id pref; do
            gh api -X DELETE repos/$R/releases/assets/$id || echo "::warning::Cancellazione dell'asset $id ($pref) non riuscita"
          done < ../da_cancellare.txt
          cd out 2>/dev/null || exit 0
          for f in *.png; do [ -e "$f" ] && mv "$f" "${TAG}_$f"; done
          [ -f logcat.txt ] && mv logcat.txt "${TAG}_logcat.txt"
          CARICA=$(ls ${TAG}_*.png "${TAG}_logcat.txt" 2>/dev/null || true)
          ESITO="Caricati nella release «diagnostica»: $(echo $CARICA | wc -w) file."
          if [ -n "$CARICA" ] && ! gh release upload diagnostica -R $R --clobber $CARICA 2> ../upload_err.txt; then
            cat ../upload_err.txt
            echo "::warning::Caricamento nella release diagnostica non riuscito: $(head -c 500 ../upload_err.txt)"
            ESITO="Caricamento nella release «diagnostica» NON riuscito: $(head -c 500 ../upload_err.txt)"
          fi
          LOGURL="https://github.com/$R/releases/download/diagnostica/${TAG}_logcat.txt"
          RUNURL="${{ github.server_url }}/$R/actions/runs/${{ github.run_id }}"
          { echo "APK: $TAG"; echo; echo "$ESITO"; echo "Registro: $LOGURL"; echo "Artifact del workflow (7 giorni): $RUNURL"; echo; echo '```'; cat cdp.txt 2>/dev/null | tail -60; echo '```'; echo; echo '```'; cat sintesi.txt 2>/dev/null | cut -c1-300 | head -250; echo '```'; } > ../report.md
          gh issue create -R $R --title "Collaudo emulatore $TAG" --body-file ../report.md
