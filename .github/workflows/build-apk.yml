name: Compila APK

on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/**', '**.md', 'garmin/**', 'android/app/src/h2/**', 'docs/garmin/**', 'docs/dossier/**', 'docs/licenze/**', 'tools/build_dossier_tecnico.py', 'docs/sensori/**']     # modifiche solo ai workflow o ai testi: nessuna nuova APK
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Dipendenze
        run: npm ci --no-audit --no-fund

      - name: Prove dell'assetto (se l'orizzonte sbaglia in virata, niente APK)
        run: node tools/test_assetto.js

      - name: Versione dentro l'app
        run: echo "window.IA517_BUILD={version:'1.0.${{ github.run_number }}',build:'${{ github.run_number }}',channel:'apk'};" > www/version.js

      - name: Pagine dentro l'app
        run: npx cap sync android

      - name: Chiave di firma (cifrata nel repository, la password è nel secret KEYSTORE_PASSWORD)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Manca il secret KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore/strumento.keystore.enc -out keystore/strumento.keystore -pass env:KEYSTORE_PASSWORD

      - name: Compila e firma
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          # solo l'APK di GitHub può installare i propri aggiornamenti (la versione del Play Store si aggiorna dal Play Store)
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />#' app/src/main/AndroidManifest.xml
          grep -c REQUEST_INSTALL_PACKAGES app/src/main/AndroidManifest.xml
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../build.log

      - name: Nome del file
        run: cp android/app/build/outputs/apk/release/app-release.apk HORIZON-1.0.${{ github.run_number }}.apk

      - name: Versione per il Play Store (AAB, senza donazioni né aggiornamenti da GitHub, come chiede Google)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -o pipefail
          echo "window.IA517_BUILD={version:'1.0.${{ github.run_number }}',build:'${{ github.run_number }}',channel:'play'};" > www/version.js
          git checkout -- android/app/src/main/AndroidManifest.xml          # niente permesso di installare app nella versione del Play Store
          ! grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml
          npx cap sync android
          (cd android && ./gradlew bundleRelease --no-daemon 2>&1 | tee -a ../build.log)
          cp android/app/build/outputs/bundle/release/app-release.aab HORIZON-1.0.${{ github.run_number }}-play-store.aab

      - name: APK di collaudo (solo per l'emulatore, con il debug della WebView; non va nelle Release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -o pipefail
          echo "window.IA517_BUILD={version:'1.0.${{ github.run_number }}',build:'${{ github.run_number }}',channel:'apk'};" > www/version.js
          sed -i 's/"webContentsDebuggingEnabled": false/"webContentsDebuggingEnabled": true/' capacitor.config.json
          grep -q '"webContentsDebuggingEnabled": true' capacitor.config.json
          npx cap sync android
          (cd android && ./gradlew assembleRelease --no-daemon 2>&1 | tee -a ../build.log)
          cp android/app/build/outputs/apk/release/app-release.apk HORIZON-collaudo.apk
          git checkout -- capacitor.config.json www/version.js

      - uses: actions/upload-artifact@v4
        with:
          name: apk-collaudo
          path: HORIZON-collaudo.apk
          retention-days: 7

      - name: Registro dell'errore (in una issue, per poterlo leggere da fuori)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -n -E "error:|ERROR|What went wrong|FAILURE|e: |warning: \[" build.log | head -60; echo '---'; tail -80 build.log; echo '```'; } > errore.md || true
          gh issue create -R ${{ github.repository }} --title "Compilazione ${{ github.run_number }} fallita" --body-file errore.md || true

      - name: Pubblica l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HORIZON 1.0.${{ github.run_number }}
          body: |
            Scarica il file .apk dal telefono e installalo (sopra la versione precedente, i dati restano).
            Il file .aab è la versione per il Play Store: si carica in Google Play Console, non si installa sul telefono.
          files: |
            HORIZON-1.0.${{ github.run_number }}.apk
            HORIZON-1.0.${{ github.run_number }}-play-store.aab

      # Google Play: il file .aab va da solo nel canale «Test interni» (i tester lo ricevono dal Play Store).
      # La pubblicazione per tutti (Produzione) resta una scelta a mano nella Play Console.
      # Serve il secret PLAY_SERVICE_ACCOUNT_JSON (chiave JSON di un account di servizio invitato nella Play Console):
      # se manca, questo passo si salta e la compilazione resta verde.
      - name: Credenziali di Google Play
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Manca il secret PLAY_SERVICE_ACCOUNT_JSON: il file .aab non viene caricato su Google Play (vedi docs/play/SCHEDA-E-GUIDA.md, capitolo 7)"; fi

      - name: Carica su Google Play (Test interni)
        if: steps.play.outputs.ok == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: it.amicoen.horizon
          releaseFiles: HORIZON-1.0.${{ github.run_number }}-play-store.aab
          releaseName: 1.0.${{ github.run_number }}
          track: internal
          status: ${{ vars.PLAY_STATUS || 'completed' }}
          whatsNewDirectory: docs/play/novita
