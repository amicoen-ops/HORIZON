name: Prepara i prati (Nord-Ovest)

# Prepara in anticipo i riquadri dei prati per l'atterraggio fuori campo e li mette sul ramo «prati-dati», da dove l'app
# li scarica già pronti (www/atterraggi.js). Prima ogni telefono li chiedeva ai servizi Overpass pubblici, lenti e spesso
# in errore: ora Overpass resta all'app solo come riserva.
#  · tools/prati_prepara.js chiede a Overpass un riquadro di 0,1° alla volta (pausa di almeno 2 s, tre servizi a turno) e
#    scrive v1/<chiave>.json e v1/indice.json; la zona (Nord-Ovest, prima prova) è la costante ZONA in cima allo script;
#  · il ramo «prati-dati» non ha storia: ogni salvataggio è UN commit solo, spinto sopra il precedente. Si parte però dai
#    file che ci sono già, così i riquadri non rifatti (o non riusciti) restano quelli di prima;
#  · si salva ogni 20 riquadri: se la corsa si interrompe il lavoro fatto è già sul ramo, e la corsa dopo riprende dai
#    riquadri che mancano (dal centro della zona verso i bordi) e poi dai più vecchi; quelli preparati da meno di 25
#    giorni si saltano;
#  · a mano («Run workflow») si può dare un limite di riquadri, per una prova breve.
#  · INCROCIO CON IL SATELLITE: ogni riquadro si confronta con la copertura del suolo ESA WorldCover (10 m, 2021; CC BY 4.0):
#    le aree «adatte» che dall'alto risultano per almeno metà bosco, case o acqua si tolgono (tools/prati_satellite.js legge
#    con GDAL solo il pezzo che serve; la regola è PD.incrocia in www/prati-dati.js). I riquadri già pronti e mai incrociati
#    si incrociano all'inizio della corsa, senza richieste a Overpass. Con «prova_satellite» si guarda cosa toglierebbe su
#    alcuni riquadri, senza salvare niente;
# Dati © contributori OpenStreetMap (ODbL). Repo pubblico: nei log solo le chiavi dei riquadri e i conteggi.
on:
  schedule:
    # ogni 6 ore: un riquadro chiede in media 3-4 minuti a Overpass, quindi una corsa ne fa circa 90 e la zona intera
    # (780) si riempie in 2-3 giorni. Poi le corse trovano poco o niente da fare e finiscono subito: ogni riquadro si
    # rifà solo dopo 25 giorni (le mappe cambiano piano, e così non si pesa sui servizi pubblici)
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      limite:
        description: "Limite di riquadri in questa corsa (vuoto = tutti quelli da fare)"
        required: false
        default: ""
      prova_satellite:
        description: "PROVA dell'incrocio con il satellite: quanti riquadri guardare, SENZA salvare niente (vuoto = corsa normale)"
        required: false
        default: ""
      prova_zona:
        description: "Zona della prova: SUD,OVEST,NORD,EST in gradi (vuoto = tutta la zona, dal primo riquadro)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: prati-prepara
  cancel-in-progress: false

jobs:
  prati:
    runs-on: ubuntu-latest
    timeout-minutes: 350            # 780 riquadri con le pause: alcune ore. Quello che non entra si fa alla corsa dopo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Prove dei prati
        run: node tools/test_prati.js
      - name: GDAL (per leggere la copertura del suolo ESA WorldCover)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gdal-bin
          gdal_translate --version
      - name: Riquadri già sul ramo «prati-dati»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q dati
          git -C dati remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # si parte dai file di prima: i riquadri che questa corsa non rifà restano
          if git -C dati fetch -q --depth 1 origin prati-dati; then
            git -C dati checkout -q FETCH_HEAD -- .
            echo "Sul ramo: $(ls dati/v1 2>/dev/null | grep -c -v '^indice.json$' || true) riquadri"
          else
            echo "Il ramo prati-dati non c'è ancora: si parte da zero"
          fi
      - name: PROVA dell'incrocio con il satellite (non salva niente)
        if: ${{ github.event.inputs.prova_satellite != '' }}
        env:
          QUANTI: ${{ github.event.inputs.prova_satellite }}
          ZONA_PROVA: ${{ github.event.inputs.prova_zona }}
        run: |
          case "$QUANTI" in *[!0-9]*) echo "::error::prova_satellite deve essere un numero"; exit 2 ;; esac
          case "$ZONA_PROVA" in *[!0-9.,-]*) echo "::error::prova_zona vuole SUD,OVEST,NORD,EST"; exit 2 ;; esac
          node tools/prati_satellite.js 452_78
          if [ -n "$ZONA_PROVA" ]; then node tools/prati_prepara.js --uscita dati --solo-satellite --limite "$QUANTI" --zona "$ZONA_PROVA" | tee prova.txt
          else node tools/prati_prepara.js --uscita dati --solo-satellite --limite "$QUANTI" | tee prova.txt; fi
          { echo "### Prova dell'incrocio con il satellite (niente salvato)"; echo '```'; grep -E 'satellite|Incrociati' prova.txt | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepara e salva ogni 20 riquadri
        if: ${{ github.event.inputs.prova_satellite == '' }}
        env:
          LIMITE: ${{ github.event.inputs.limite }}
          PRATI_OPZIONI: "--freschi 25 --satellite"
          PRATI_GRUPPO: "20"
        run: |
          bash tools/prati_pubblica.sh dati "$LIMITE"
