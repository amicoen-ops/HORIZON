name: Sonda fonti spazi aerei

on:
  push:
    branches: [sonda]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Prova gli indirizzi
        run: |
          {
          for h in api.polar.sh sandbox-api.polar.sh; do
            for o in https://amicoen-ops.github.io https://localhost; do
              echo "=== $h preflight da $o"
              curl -sS -o /dev/null -D - -X OPTIONS -H "Origin: $o" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" "https://$h/v1/customer-portal/license-keys/validate" | grep -i -E "^HTTP|access-control"
            done
            echo "=== $h validate chiave finta"
            curl -sS -H "Origin: https://localhost" -H "Content-Type: application/json" -d '{"key":"IA517-FINTA","organization_id":"00000000-0000-0000-0000-000000000000"}' -D - "https://$h/v1/customer-portal/license-keys/validate" | grep -i -E "^HTTP|access-control|detail|error" | head -8
          done
          } > sonda.txt 2>&1
          cat sonda.txt
      - name: Copia del file nella pre-release diagnostica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          true
      - name: Risultato in una issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; head -c 60000 sonda.txt; echo '```'; } > corpo.md
          gh issue create -R ${{ github.repository }} --title "Sonda spazi aerei" --body-file corpo.md
