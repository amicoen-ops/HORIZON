name: Sonda fonti spazi aerei

on:
  push:
    branches: [sonda]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Prova gli indirizzi
        run: |
          {
          B=https://storage.openaip.net/openaip-system-exports
          for n in it_rpp it_rpp_v2 it_nav it_hot it_apt it_obs; do for x in geojson json ndgeojson cup cupx aip txt; do
            c=$(curl -sS -L -o "$n.$x" -w "%{http_code} %{size_download}" --max-time 60 "$B/$n.$x" || echo "err")
            echo "$n.$x  $c"; case "$c" in 200*) ;; *) rm -f "$n.$x";; esac
          done; done
          echo "=== prime righe dei punti di riporto"; for f in it_rpp*; do echo "--- $f"; head -c 1500 "$f"; echo; done
          } > sonda.txt 2>&1
          cat sonda.txt
      - name: Copia del file nella pre-release diagnostica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in it_rpp*; do gh release upload diagnostica -R ${{ github.repository }} --clobber "$f" || true; done
      - name: Risultato in una issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; head -c 60000 sonda.txt; echo '```'; } > corpo.md
          gh issue create -R ${{ github.repository }} --title "Sonda spazi aerei" --body-file corpo.md
