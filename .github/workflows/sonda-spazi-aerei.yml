name: Sonda fonti spazi aerei

on:
  push:
    branches: [sonda]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prova gli indirizzi
        run: |
          mkdir -p oa
          for cc in it fr ch at si; do curl -sSfL --max-time 120 -o oa/${cc}_apt.json https://storage.openaip.net/openaip-system-exports/${cc}_apt.json || echo "manca $cc"; done
          { python3 tools/carburante_openaip.py oa carburante.json; echo; cat carburante.json; } > sonda.txt 2>&1
          head -c 3000 sonda.txt
      - name: Copia del file nella pre-release diagnostica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          true
      - name: Risultato in una issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; head -c 60000 sonda.txt; echo '```'; } > corpo.md
          gh issue create -R ${{ github.repository }} --title "Sonda carburante JSON" --body-file corpo.md
